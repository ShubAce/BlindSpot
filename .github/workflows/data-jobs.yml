# BlindSpot data pipeline on free GitHub Actions runners (public repo).
# Each schedule runs one group of jobs from `python -m blindspot.jobs`; results land in Neon (PostGIS),
# which the Vercel API reads. Chained jobs run automatically: met -> smoke, sentinel -> risk + featured,
# bulletin -> featured_investigations. Secrets: DATABASE_URL (Neon direct endpoint) and the API keys;
# set them with infra/set_github_secrets.py. Until DATABASE_URL is set, every run skips quietly.
# GitHub's own cron has been unreliable in 2026 (scheduled runs hours late or never created, manual
# dispatches fine), so scheduler.yml keeps this timetable and dispatches each slot with `slot` set to
# the cron string below; a run picks its jobs the same way either way.
name: data-jobs

# Cadence is sized to Neon's free plan (100 CU-hours and 5 GB egress a month; the database is
# suspended until the next month if either runs out): docs/neon-budget.md. Every run keeps the
# compute awake for its own length plus 5 minutes, so the jobs run hourly only while fires burn and
# data arrive, and every other group starts at :17 together with an hourly-group run, so its work
# shares that wake-up instead of paying its own 5-minute tail. Only the 07:30 IST bulletin has a
# wake of its own. The API's CDN expiry clocks (services/api/blindspot/api/cache.py) follow these
# times; tests/test_deploy_serve.py checks that they still do.
on:
  schedule:
    - cron: "17 8-18 * * *"        # hourly 13:47-23:47 IST: fires, official counts, air quality, geostationary scans
    - cron: "17 0,3,6,21 * * *"    # the same group every ~3 h overnight and in the morning
    - cron: "17 3,9,15,21 * * *"   # met grid every 6 h (-> smoke trajectories), IITM DSS
    - cron: "17 11 * * *"          # 16:47 IST: Sentinel-2 scenes (-> burn risk, featured frames), smoke check, orbits
    - cron: "0 2 * * *"            # bulletin 07:30 IST (-> featured investigations)
    - cron: "17 3,6 * * *"         # bulletin retries 08:47 and 11:47 IST (idempotent: a no-op once written)
    - cron: "17 6 * * *"           # 11:47 IST: season backfills, retention
    - cron: "17 3 * * 1"           # weekly: boundaries and places
  workflow_dispatch:
    inputs:
      jobs:
        description: "Space-separated job names (python -m blindspot.jobs list)"
        required: false
        default: "firms_nrt air"
      slot:
        description: "A cron string from the schedule above (set by scheduler.yml); overrides jobs"
        required: false
        default: ""

permissions:
  contents: read
  actions: write   # see whether scheduler.yml is running, and restart it if it is not

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.event.schedule || github.event.inputs.slot) == '17 11 * * *' && 150 || 60 }}
    concurrency:
      group: data-jobs-${{ github.event.schedule || github.event.inputs.slot || 'manual' }}
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
      DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
      LSASAF_USERNAME: ${{ secrets.LSASAF_USERNAME }}
      LSASAF_PASSWORD: ${{ secrets.LSASAF_PASSWORD }}
      ENABLE_SCHEDULER: "0"
      INIT_DB_ON_STARTUP: "0"
      SENTINEL_BUDGET_MIN: "40"
      CACHE_DIR: /tmp/blindspot-cache   # the runner context is not available in job-level env
      PUBLIC_API_URL: https://blindspot-api-azure.vercel.app
      # data.gov.in refuses connections from these (US) runners; the relay runs in Mumbai and
      # forwards only data.gov.in resource reads (infra/relay, infra/deploy_vercel_relay.py).
      DATAGOV_RELAY_URL: https://blindspot-relay.vercel.app
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Leave a scheduled slot to scheduler.yml while it is running
        id: dedupe
        if: github.event_name == 'schedule'
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow scheduler.yml --status in_progress --json databaseId --jq length 2>/dev/null || echo 0)
          if [ "${n:-0}" -gt 0 ]; then
            echo "::notice::scheduler.yml dispatches this slot; skipping the duplicate."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check that the database secret is set
        id: guard
        shell: bash
        working-directory: .
        run: |
          if [ "${{ steps.dedupe.outputs.skip }}" = "true" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$DATABASE_URL" ]; then
            echo "::notice::DATABASE_URL secret is not set; skipping (run infra/set_github_secrets.py)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.configured == 'true'

      - uses: astral-sh/setup-uv@v6
        if: steps.guard.outputs.configured == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - name: Install locked dependencies
        if: steps.guard.outputs.configured == 'true'
        run: uv sync --frozen --no-dev

      - name: Pick the jobs for this trigger
        if: steps.guard.outputs.configured == 'true'
        id: pick
        shell: bash
        run: |
          # `beside`: jobs that run at the same time as `jobs` (in their own process), so the
          # database is awake for the longest of them, not their sum. air (~6 min on a runner: many
          # slow upstream calls) needs nothing the others write; geostationary reads firms_nrt's rows.
          beside=""
          case "${{ github.event.schedule || github.event.inputs.slot }}" in
            "17 8-18 * * *"|"17 0,3,6,21 * * *") jobs="firms_nrt creams_daily geostationary"; beside="air" ;;
            "17 3,9,15,21 * * *") jobs="met air_dss" ;;
            "17 11 * * *")  jobs="sentinel smoke_validate tle" ;;
            "0 2 * * *"|"17 3,6 * * *") jobs="bulletin" ;;
            "17 6 * * *")   jobs="firms_backfill geostationary_backfill prune" ;;
            "17 3 * * 1")   jobs="boundaries" ;;
            *)              jobs="${{ github.event.inputs.jobs }}" ;;
          esac
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
          echo "beside=$beside" >> "$GITHUB_OUTPUT"

      - name: Run jobs
        if: steps.guard.outputs.configured == 'true'
        shell: bash
        run: |
          status=0
          pids=""
          for job in ${{ steps.pick.outputs.beside }}; do
            uv run python -m blindspot.jobs run "$job" > "/tmp/job-$job.log" 2>&1 &
            pids="$pids $!:$job"
          done
          for job in ${{ steps.pick.outputs.jobs }}; do
            echo "::group::$job"
            uv run python -m blindspot.jobs run "$job" || status=1
            echo "::endgroup::"
          done
          for entry in $pids; do
            pid="${entry%%:*}"; job="${entry#*:}"
            wait "$pid" || status=1
            echo "::group::$job (ran beside the others)"
            cat "/tmp/job-$job.log"
            echo "::endgroup::"
          done
          exit $status

      # A check that the API answers, while the database is still awake from the jobs (no extra
      # wake; /api/health reads a few bytes). Nothing heavier: the CDN keeps one cache per region,
      # this runner is not in India, and the website's copies expire on the clocks in api/cache.py,
      # so a warmed headline here would only cost Neon ~190 KB a run for a copy nobody reads.
      - name: Refresh the API's CDN cache
        if: always() && steps.guard.outputs.configured == 'true'
        shell: bash
        run: |
          curl -fsS -o /dev/null --max-time 60 "$PUBLIC_API_URL/api/health" && echo "API answers" || echo "API did not answer"

      - name: Restart scheduler.yml if it has stopped
        if: always() && steps.guard.outputs.configured == 'true'
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow scheduler.yml --limit 5 --json status --jq '[.[] | select(.status != "completed")] | length' 2>/dev/null || echo 1)
          if [ "${n:-1}" -eq 0 ]; then
            gh workflow run scheduler.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" && echo "restarted scheduler.yml"
          fi
