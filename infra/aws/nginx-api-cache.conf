# BlindSpot: a shared cache in front of the API, in place of the CDN its Cache-Control headers were
# written for (services/api/blindspot/api/cache.py, CDN_RULES). Each answer is kept until the job
# clock that feeds it next ticks (s-maxage), then served at once while one background request
# refreshes it (stale-while-revalidate), and served stale for a week if the API fails
# (stale-if-error). A page view therefore costs the database nothing between job runs, however
# heavy the query behind it (district aggregations over ~450k burn scars). When a daily job
# finishes later than its clock assumes, the warm timer replaces the answers it feeds at once,
# through the refresh door at the end of this file (infra/aws/warm.sh).
#
# Installed to /etc/nginx/conf.d/blindspot-api-cache.conf by infra/aws/deploy.py. It listens on
# 127.0.0.1:8000, the address Caddy (api.blindspotin.tech) and the website (API_INTERNAL_URL) use;
# uvicorn itself is on 127.0.0.1:8001. The cache is capped at 300 MB (least recently used goes).
# Every answer carries `Vary: Origin` (the CORS middleware), so the website's server-side reads send
# the site's own Origin (apps/web/src/lib/api-server.ts) and share the browsers' copy of each answer.

proxy_cache_path /var/cache/nginx/blindspot levels=1:2 keys_zone=blindspot_api:8m max_size=300m inactive=7d use_temp_path=off;

server {
    listen 127.0.0.1:8000;
    access_log off;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;      # Caddy's: the visitor's address
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Accept-Encoding "";  # plain bodies from the API; Caddy compresses for visitors
    proxy_read_timeout 300s;

    # The investigator's answer stream: never cached or buffered, and stopped when the visitor leaves.
    location /api/agent/ask {
        proxy_pass http://127.0.0.1:8001;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_cache blindspot_api;
        proxy_cache_key $request_uri;
        # One request builds a missing answer and the others wait for it, even when the build is
        # slow (a cold cache on a busy server): never a pile of identical heavy queries.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 300s;
        proxy_cache_lock_age 300s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        # A page that gave up waiting (the website reads with a 10-15 s timeout) still leaves the
        # answer cached for the next visitor.
        proxy_ignore_client_abort on;
        add_header X-Cache $upstream_cache_status always;
    }
}

# The refresh door of the warm timer (infra/aws/warm.sh): the same cache, but every request goes to
# the API and its answer replaces the cached copy (proxy_cache_bypass skips the lookup and still
# stores the response; an error is not stored, so the old copy stays). Used after a daily job
# finishes, so that the answers it feeds change at once, not at their clock's next tick. Only
# processes on this server can reach it: Caddy and the website use :8000.
server {
    listen 127.0.0.1:8002;
    access_log off;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Accept-Encoding "";
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_cache blindspot_api;
        proxy_cache_key $request_uri;
        proxy_cache_bypass 1;
        proxy_ignore_client_abort on;
        add_header X-Cache $upstream_cache_status always;
    }
}
